name: Site checks

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

jobs:
  site-checks:
    name: Site regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run source regression tests
        run: python3 -B -m unittest discover -s tests -v
